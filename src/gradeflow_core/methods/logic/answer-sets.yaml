version: 1
label: Answer Sets
summary: Marks for the best of several sets of answers.
level: advanced
marks_question_group: true
guide: |-
  For several questions where more than one set of answers deserves marks, such as when a mistake in an early part carries through to later parts.

  Each set holds checks for the questions it covers, and its weight is its share of the marks. Within a set, each question is marked by its own check. Every set is tried, and the set that gives the student the most marks over all its questions counts.

  For example, Q1 asks for a rectangle's perimeter and Q2 uses that perimeter. The first set, Expected, checks the right answers to both. A second set at 50% checks the answers that follow from a common slip in Q1. A student who made that slip gets half marks on both questions instead of none.

  To work a later number out from whatever each student answered earlier, use Formula of Answers.
settings:
  sets:
    title: Sets
    description: Each set checks the questions it covers, with its share of the marks.
    default:
      - {name: Expected, uses: gradeflow/workflow@1, with: {steps: []}}
marks_by: any_correct
steps: "{{ settings.sets }}"
examples:
  - title: A rectangle is 6 cm by 4 cm.
    description: |-
      Any one of these:
      - **Expected:** All of these:
        - **Q1:** Matches `20`.
        - **Q2:** Matches `25`.
      - **Perimeter as 6 + 4** (50% of the marks): All of these:
        - **Q1:** Matches `10`.
        - **Q2:** Matches `6.25`.
    questions:
      Q1: {type: number, description: What is its perimeter?}
      Q2: {type: number, description: What is the area of a square with the same perimeter?}
    with:
      sets:
        - name: Expected
          uses: gradeflow/workflow@1
          with:
            steps:
            - {question: Q1, uses: gradeflow/accepted-answers@1, with: {answers: ['20']}}
            - {question: Q2, uses: gradeflow/accepted-answers@1, with: {answers: ['25']}}
        - name: Perimeter as 6 + 4
          weight: 0.5
          uses: gradeflow/workflow@1
          with:
            steps:
            - {question: Q1, uses: gradeflow/accepted-answers@1, with: {answers: ['10']}}
            - {question: Q2, uses: gradeflow/accepted-answers@1, with: {answers: ['6.25']}}
    rows:
      - answers:
          Q1: '20'
          Q2: '25'
        expected:
          Q1: {marks: 1.0, feedback: Correct.}
          Q2: {marks: 1.0, feedback: Correct.}
      - answers:
          Q1: '10'
          Q2: '6.25'
        expected:
          Q1: {marks: 0.5, feedback: Perimeter as 6 + 4 (50% of the marks).}
          Q2: {marks: 0.5, feedback: Perimeter as 6 + 4 (50% of the marks).}
      - answers:
          Q1: '20'
          Q2: '6.25'
        expected:
          Q1: {marks: 1.0, feedback: Correct.}
          Q2: {marks: 0.0, feedback: Expected 25.}
      - answers:
          Q1: '24'
          Q2: '36'
        expected:
          Q1: {marks: 0.0, feedback: Expected 20.}
          Q2: {marks: 0.0, feedback: Expected 25.}
  - title: Work out 6 ÷ 2(1 + 2).
    description: |-
      Any one of these:
      - **Left to right:** All of these:
        - **Q1:** Matches `9`.
        - **Q2:** Matches `81`.
      - **Brackets first:** All of these:
        - **Q1:** Matches `1`.
        - **Q2:** Matches `1`.
    questions:
      Q1: {type: number, description: What is the answer?}
      Q2: {type: number, description: "What is your answer to Q1, squared?"}
    with:
      sets:
        - name: Left to right
          uses: gradeflow/workflow@1
          with:
            steps:
            - {question: Q1, uses: gradeflow/accepted-answers@1, with: {answers: ['9']}}
            - {question: Q2, uses: gradeflow/accepted-answers@1, with: {answers: ['81']}}
        - name: Brackets first
          uses: gradeflow/workflow@1
          with:
            steps:
            - {question: Q1, uses: gradeflow/accepted-answers@1, with: {answers: ['1']}}
            - {question: Q2, uses: gradeflow/accepted-answers@1, with: {answers: ['1']}}
    rows:
      - answers:
          Q1: '9'
          Q2: '81'
        expected:
          Q1: {marks: 1.0, feedback: Correct.}
          Q2: {marks: 1.0, feedback: Correct.}
      - answers:
          Q1: '1'
          Q2: '1'
        expected:
          Q1: {marks: 1.0, feedback: Correct.}
          Q2: {marks: 1.0, feedback: Correct.}
      - answers:
          Q1: '9'
          Q2: '1'
        expected:
          Q1: {marks: 1.0, feedback: Correct.}
          Q2: {marks: 0.0, feedback: Expected 81.}
