version: 1
label: Not Allowed
summary: Correct unless the answer does what you forbid.
level: advanced
question_types: all
guide: |-
  For something an answer must not do, such as use a loop or make a common mistake.

  Inside it, add a check that finds the forbidden thing, such as Code Uses looking for a loop. If that check finds it, the answer gets no marks. If not, the answer gets full marks.

  On its own, Not Allowed gives full marks to every answer that avoids the mistake, right or wrong. To mark the answer as well, put it in a Workflow with **All must be correct**, beside the check for the right answer.

  To forbid certain words, Key Points with **None may be correct** is simpler.
settings:
  check:
    title: Check
    description: The check for what the answer must not do.
marks_by: none_correct
steps:
  - "{{ settings.check }}"
description: "**Not allowed:** {{ parts | first }}"
examples:
  - title: Write total(numbers), which returns the sum of a list, without a loop.
    description: |-
      **Not allowed:** Uses a loop.
    questions:
      Q1: {type: code}
    with:
      check:
        uses: gradeflow/code-uses@1
        with: {looks_for: loop}
    rows:
      - answers:
          Q1: "def total(numbers):\n    return sum(numbers)"
        expected:
          Q1: {marks: 1.0, feedback: Correct.}
      - answers:
          Q1: "def total(numbers):\n    result = 0\n    for n in numbers:\n        result += n\n    return result"
        expected:
          Q1: {marks: 0.0, feedback: Not allowed. Uses a loop.}
  - title: Write sort_list(items), which returns the items in order, without calling sorted.
    description: |-
      **Not allowed:** Calls `sorted`.
    questions:
      Q1: {type: code}
    with:
      check:
        uses: gradeflow/code-uses@1
        with: {looks_for: call, function: sorted}
    rows:
      - answers:
          Q1: "def sort_list(items):\n    items = list(items)\n    items.sort()\n    return items"
        expected:
          Q1: {marks: 1.0, feedback: Correct.}
      - answers:
          Q1: "def sort_list(items):\n    return sorted(items)"
        expected:
          Q1: {marks: 0.0, feedback: Not allowed. Calls “sorted”.}
