examples:
  - title: Pens cost $2 and books $5. What do 3 pens and 2 books cost? Show your working.
    description: |-
      AI checks the answer for each of these:
      - Correct total (2 marks)
      - Shows the working (1 mark)
      - Forgot to sum (-1 mark)
    questions:
      Q1: {type: text, max_marks: 3, description: "Pens cost $2 and books $5. What do 3 pens and 2 books cost? Show your working."}
    with:
      criteria:
        - {text: Correct total, marks: 2}
        - {text: Shows the working, marks: 1}
        - {text: Forgot to sum, marks: -1}
      model_answer: 3 × 2 = 6 and 2 × 5 = 10, so 6 + 10 = $16
    rows:
      - answers:
          Q1: 3 × 2 = 6 and 2 × 5 = 10, so 6 + 10 = $16
        expected:
          Q1:
            marks: 3.0
            feedback: |-
              Correct total.
              Shows the working.
      - answers:
          Q1: 3 × 2 = 6 and 2 × 5 = 10, so she pays $6 and $10
        expected:
          Q1:
            marks: 0.0
            feedback: |-
              Correct total: Not met.
              Shows the working.
              Penalty: Forgot to sum.
      - answers:
          Q1: $16
        expected:
          Q1:
            marks: 2.0
            feedback: |-
              Correct total.
              Shows the working: Not met.
  - title: Why does ice float on water?
    description: |-
      AI checks the answer for each of these:
      - Says ice is less dense than water (1 mark)
      - Explains that water expands as it freezes (1 mark)
      - Says ice is denser than water (-1 mark)
    questions:
      Q1: {type: text, max_marks: 2, description: Why does ice float on water?}
    with:
      criteria:
        - {text: Says ice is less dense than water, marks: 1}
        - {text: Explains that water expands as it freezes, marks: 1}
        - {text: Says ice is denser than water, marks: -1}
    rows:
      - answers:
          Q1: Water expands as it freezes, so ice is less dense than liquid water.
        expected:
          Q1:
            marks: 2.0
            feedback: |-
              Says ice is less dense than water.
              Explains that water expands as it freezes.
      - answers:
          Q1: Because ice is less dense than water.
        expected:
          Q1:
            marks: 1.0
            feedback: |-
              Says ice is less dense than water.
              Explains that water expands as it freezes: Not met.
      - answers:
          Q1: Ice is denser than water, so it floats.
        expected:
          Q1:
            marks: 0.0
            feedback: |-
              Says ice is less dense than water: Not met.
              Explains that water expands as it freezes: Not met.
              Penalty: Says ice is denser than water.
  - title: Write largest(numbers), which returns the largest number in a non-empty list.
    description: |-
      AI checks the answer for each of these:
      - Compares each number with the largest so far (1 mark)
      - Works when every number is negative (1 mark)
      - Uses max (-2 marks)
    questions:
      Q1: {type: code, max_marks: 2, description: "Write largest(numbers), which returns the largest number in a non-empty list."}
    with:
      criteria:
        - {text: Compares each number with the largest so far, marks: 1}
        - {text: Works when every number is negative, marks: 1}
        - {text: Uses max, marks: -2}
    rows:
      - answers:
          Q1: |-
            def largest(numbers):
                best = numbers[0]
                for number in numbers:
                    if number > best:
                        best = number
                return best
        expected:
          Q1:
            marks: 2.0
            feedback: |-
              Compares each number with the largest so far.
              Works when every number is negative.
      - answers:
          Q1: |-
            def largest(numbers):
                best = 0
                for number in numbers:
                    if number > best:
                        best = number
                return best
        expected:
          Q1:
            marks: 1.0
            feedback: |-
              Compares each number with the largest so far.
              Works when every number is negative: Not met.
      - answers:
          Q1: |-
            def largest(numbers):
                return max(numbers)
        expected:
          Q1:
            marks: 0.0
            feedback: |-
              Compares each number with the largest so far: Not met.
              Works when every number is negative.
              Penalty: Uses max.
  - title: Why does the Moon show phases?
    description: |-
      AI picks the criterion that best fits the answer:
      - Explains that we see different amounts of the sunlit half as the Moon orbits (3 marks)
      - Says the orbit of the Moon causes the phases (2 marks)
      - Mentions sunlight (1 mark)
    questions:
      Q1: {type: text, max_marks: 3, description: Why does the Moon show phases?}
    with:
      marks_by: best_fit
      criteria:
        - {text: Explains that we see different amounts of the sunlit half as the Moon orbits, marks: 3}
        - {text: Says the orbit of the Moon causes the phases, marks: 2}
        - {text: Mentions sunlight, marks: 1}
    rows:
      - answers:
          Q1: As the Moon orbits Earth, we see different amounts of its sunlit half.
        expected:
          Q1:
            marks: 3.0
            feedback: Explains that we see different amounts of the sunlit half as the Moon orbits.
      - answers:
          Q1: Because the Moon moves around Earth.
        expected:
          Q1:
            marks: 2.0
            feedback: Says the orbit of the Moon causes the phases.
      - answers:
          Q1: Because clouds cover the Moon.
        expected:
          Q1:
            marks: 0.0
            feedback: Fits no criterion.
