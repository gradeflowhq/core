version: 1
label: Answer Criteria
summary: Marks for each criterion the answer meets.
question_types: [text, code]
guide: |-
  **Use it when:** An answer needs a marker's judgement, such as a calculation whose working earns marks.

  **How it marks:** AI decides which **Criteria** fit the answer, and each one that fits gives its marks, or a penalty when negative. **How to decide** chooses fast, careful, which leaves answers it is unsure about for you, or careful only where a fast decision is unsure.

  **Good to know:** Answers are sent to your AI service, and careful decisions take minutes where fast ones take seconds. Each criterion gives marks of the question, or a penalty when negative, and the total stays between zero and full marks, so give marks for what's correct as well as penalties for mistakes.

  **Related:** To look only for what the answer says, use Key Points.
inputs:
  criteria:
    title: Criteria
    description: What to look for in an answer, and the question's marks it gives, or a penalty when negative.
    items:
      marks:
        title: Marks
        description: ""
        examples: [2, 1, 0.5, -0.5, -1]
  model_answer:
    default: null
  decide_with:
    default: fast
  confidence_needed:
    default: 0.9
  careful_effort:
    default: automatic
combine: total
checks:
  - for_each: "{{ inputs.criteria }}"
    name: "{{ item.criterion }}"
    weight: "{{ item.marks }}"
    uses: gradeflow/answer-criterion@1
    with:
      criterion: "{{ item.criterion }}"
      model_answer: "{{ inputs.model_answer }}"
      decide_with: "{{ inputs.decide_with }}"
      confidence_needed: "{{ inputs.confidence_needed }}"
      careful_effort: "{{ inputs.careful_effort }}"
description: |-
  AI checks the answer for {% for each in inputs.criteria %}{% if loop.length > 1 %}{% if loop.first %}each of these:{% endif %}{{ "\n" }}- {% endif %}{{ each.criterion | escaped }} ({{ each.marks }} mark{% if each.marks not in [1, -1] %}s{% endif %}){% if loop.length == 1 %}.{% endif %}{% endfor %}
examples:
  - title: Pens cost $2 and books $5. What do 3 pens and 2 books cost? Show your working.
    description: |-
      AI checks the answer for each of these:
      - Correct total (2 marks)
      - Shows the working (1 mark)
      - Forgot to sum (-1 mark)
    questions:
      Q1: {type: text, max_marks: 3, description: "Pens cost $2 and books $5. What do 3 pens and 2 books cost? Show your working."}
    with:
      criteria:
        - {criterion: Correct total, marks: 2}
        - {criterion: Shows the working, marks: 1}
        - {criterion: Forgot to sum, marks: -1}
      model_answer: 3 × 2 = 6 and 2 × 5 = 10, so 6 + 10 = $16
    rows:
      - answers:
          Q1: 3 × 2 = 6 and 2 × 5 = 10, so 6 + 10 = $16
        expected:
          Q1:
            marks: 3.0
            feedback: |-
              Correct total.
              Shows the working.
      - answers:
          Q1: 3 × 2 = 6 and 2 × 5 = 10, so she pays $6 and $10
        expected:
          Q1:
            marks: 0.0
            feedback: |-
              Correct total: Not met.
              Shows the working.
              Penalty: Forgot to sum.
      - answers:
          Q1: $16
        expected:
          Q1:
            marks: 2.0
            feedback: |-
              Correct total.
              Shows the working: Not met.
  - title: Why does ice float on water?
    description: |-
      AI checks the answer for each of these:
      - Says ice is less dense than water (1 mark)
      - Explains that water expands as it freezes (1 mark)
      - Says ice is denser than water (-1 mark)
    questions:
      Q1: {type: text, max_marks: 2, description: Why does ice float on water?}
    with:
      criteria:
        - {criterion: Says ice is less dense than water, marks: 1}
        - {criterion: Explains that water expands as it freezes, marks: 1}
        - {criterion: Says ice is denser than water, marks: -1}
    rows:
      - answers:
          Q1: Water expands as it freezes, so ice is less dense than liquid water.
        expected:
          Q1:
            marks: 2.0
            feedback: |-
              Says ice is less dense than water.
              Explains that water expands as it freezes.
      - answers:
          Q1: Because ice is less dense than water.
        expected:
          Q1:
            marks: 1.0
            feedback: |-
              Says ice is less dense than water.
              Explains that water expands as it freezes: Not met.
      - answers:
          Q1: Ice is denser than water, so it floats.
        expected:
          Q1:
            marks: 0.0
            feedback: |-
              Says ice is less dense than water: Not met.
              Explains that water expands as it freezes: Not met.
              Penalty: Says ice is denser than water.
  - title: Write largest(numbers), which returns the largest number in a non-empty list.
    description: |-
      AI checks the answer for each of these:
      - Compares each number with the largest so far (1 mark)
      - Works when every number is negative (1 mark)
      - Uses max (-2 marks)
    questions:
      Q1: {type: code, max_marks: 2, description: "Write largest(numbers), which returns the largest number in a non-empty list."}
    with:
      criteria:
        - {criterion: Compares each number with the largest so far, marks: 1}
        - {criterion: Works when every number is negative, marks: 1}
        - {criterion: Uses max, marks: -2}
    rows:
      - answers:
          Q1: |-
            def largest(numbers):
                best = numbers[0]
                for number in numbers:
                    if number > best:
                        best = number
                return best
        expected:
          Q1:
            marks: 2.0
            feedback: |-
              Compares each number with the largest so far.
              Works when every number is negative.
      - answers:
          Q1: |-
            def largest(numbers):
                best = 0
                for number in numbers:
                    if number > best:
                        best = number
                return best
        expected:
          Q1:
            marks: 1.0
            feedback: |-
              Compares each number with the largest so far.
              Works when every number is negative: Not met.
      - answers:
          Q1: |-
            def largest(numbers):
                return max(numbers)
        expected:
          Q1:
            marks: 0.0
            feedback: |-
              Compares each number with the largest so far: Not met.
              Works when every number is negative.
              Penalty: Uses max.
