name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      # The ml tests' models, downloaded again only when a pinned model changes.
      - id: models
        run: echo "key=models-$(grep -hE '^(REPOSITORY|REVISION|DOWNLOADED_MODEL|EMBEDDING_MODEL) =' src/gradeflow_core/models/*.py | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/gradeflow/models
          key: ${{ steps.models.outputs.key }}
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
